services:
  postgress_nest:
    container_name: postgress_nest
    restart: always
    image: postgres:16-alpine
    ports:
      - '${BD_PORT}:5432' # Usa la variable del archivo .env
    environment:
      POSTGRES_DB: ${BD_DATABASE}
      POSTGRES_USER: ${BD_USERNAME}
      POSTGRES_PASSWORD: ${BD_PASSWORD}
    volumes:
      - pg_data_nest:/var/lib/postgresql/data

volumes:
    pg_data_nest: